<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨许煊的个人网站</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-muted: #a0a0a0;
  --line: #e5e5e5;
  --line-light: #f0f0f0;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --gold: #c9a84c;
  --gold-light: #fdf6e3;
  --radius: 8px;
  --nav-height: 56px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: linear-gradient(180deg, #ffffff 0%, #dbe9f7 35%, #bcd7ee 100%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ========== Cover Page ========== */
.cover {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: all;
  overflow: hidden;
}
.cover::before {
  content: '';
  position: absolute; inset: 0;
  background-image: url('images/cover.png');
  background-size: 130% auto;
  background-position: 25% 30%;
  background-repeat: no-repeat;
  z-index: 0;
}
.cover::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255, 255, 255, 0.55);
  z-index: 1;
}
.cover > * {
  position: relative;
  z-index: 2;
}
.cover.hidden {
  opacity: 0;
  transform: translateY(-100%);
  pointer-events: none;
}
.cover-title {
  font-family: 'Dancing Script', cursive;
  font-size: 5.5rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #000;
  margin-bottom: 0.5rem;
}
.cover-subtitle {
  font-family: 'Dancing Script', cursive;
  font-size: 3rem;
  font-weight: 600;
  color: #000;
  letter-spacing: 0.02em;
  margin-bottom: 3rem;
}
.cover-scroll-hint {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: #000;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  animation: float 2s ease-in-out infinite;
}
.cover-arrow {
  width: 24px; height: 24px;
  border-right: 1px solid #000;
  border-bottom: 1px solid #000;
  transform: rotate(45deg);
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

/* ========== Decorative Lines (Background) ========== */
.bg-lines {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.04;
}
.bg-lines svg { width: 100%; height: 100%; }

/* ========== Navigation ========== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-height);
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  opacity: 0; transform: translateY(-10px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
}
.nav.visible {
  opacity: 1; transform: translateY(0);
  pointer-events: all;
}
.nav-brand {
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
}

/* ========== Main Content Wrapper ========== */
.main-wrapper {
  position: relative; z-index: 1;
  padding-top: var(--nav-height);
}

/* ========== Page Sections (Home, High School, University) ========== */
.page {
  display: none;
  min-height: calc(100vh - var(--nav-height));
  animation: fadeSlideIn 0.4s ease;
}
.page.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ========== Home Page ========== */
.home {
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  min-height: calc(100vh - var(--nav-height));
  padding: 4rem 2rem;
}
.home.active { display: flex; }
.home-intro { text-align: center; margin-bottom: 4rem; }
.home-name {
  font-size: 2.8rem; font-weight: 300;
  letter-spacing: 0.08em; margin-bottom: 0.75rem;
}
.home-desc {
  font-size: 1.05rem; color: var(--text-secondary);
  font-weight: 300; letter-spacing: 0.04em;
  max-width: 480px; line-height: 1.8;
}
.home-cards {
  display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;
}

/* 首页逐级显现动画 */
.home.revealing .home-name { animation: homeRise 0.8s ease backwards; animation-delay: 0.6s; }
.home.revealing .home-desc { animation: homeRise 0.8s ease backwards; animation-delay: 0.9s; }
.home.revealing .home-card { animation: homeRise 0.8s ease backwards; }
.home.revealing .home-card:nth-child(1) { animation-delay: 1.2s; }
.home.revealing .home-card:nth-child(2) { animation-delay: 1.35s; }

@keyframes homeRise {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.home-card {
  display: flex; flex-direction: column; align-items: center;
  width: 240px; padding: 2.5rem 2rem;
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.35s ease;
  text-decoration: none; color: var(--text);
  position: relative;
  overflow: hidden;
}
/* 全息扫描线 */
.home-card::before {
  content: '';
  position: absolute;
  left: 0; right: 0;
  top: -60%;
  height: 60%;
  background: linear-gradient(180deg, transparent, rgba(37, 99, 235, 0.18), transparent);
  pointer-events: none;
  opacity: 0;
}
.home-card:hover::before {
  animation: scan 1.1s ease forwards;
}
@keyframes scan {
  0%   { top: -60%; opacity: 1; }
  100% { top: 110%; opacity: 1; }
}
.home-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 40px rgba(37, 99, 235, 0.18);
  border-color: rgba(37, 99, 235, 0.25);
  background: rgba(255, 255, 255, 0.85);
}
.home-card-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1.25rem;
  font-size: 1.1rem; font-weight: 600; color: #fff;
  transition: all 0.35s ease;
}
/* 高中卡片图标：蓝色 */
.home-card:nth-child(1) .home-card-icon {
  background: linear-gradient(135deg, #60a5fa, #2563eb);
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
}
/* 大学卡片图标：绿色 */
.home-card:nth-child(2) .home-card-icon {
  background: linear-gradient(135deg, #34d399, #059669);
  box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
}
.home-card:hover .home-card-icon {
  transform: scale(1.08);
}
.home-card-title {
  font-size: 1.15rem; font-weight: 500;
  letter-spacing: 0.04em; margin-bottom: 0.4rem;
}
.home-card-desc {
  font-size: 0.85rem; color: var(--text-secondary);
  text-align: center; line-height: 1.6;
}

/* ========== Content Pages (High School & University) ========== */
.content-page {
  min-height: calc(100vh - var(--nav-height));
  padding: 3rem 2rem 4rem;
  max-width: 1080px;
  margin: 0 auto;
}

.view-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 2rem;
}
.view-title {
  font-size: 1.5rem; font-weight: 500;
  letter-spacing: 0.04em;
}
.view-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.85rem; color: var(--text-secondary);
  background: none; border: none; cursor: pointer;
  padding: 0.4rem 0.7rem; border-radius: 6px;
  letter-spacing: 0.03em;
  transition: all 0.2s ease;
}
.view-back:hover { color: var(--accent); background: var(--accent-light); }
.back-arrow {
  display: inline-block;
  width: 8px; height: 8px;
  border-left: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(45deg);
}

/* ===== 第一级：板块方框 ===== */
.section-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.25rem;
}
.section-grid.grid-2x2 { grid-template-columns: repeat(2, 1fr); }
.section-box {
  display: flex; flex-direction: column; justify-content: center;
  min-height: 132px;
  padding: 1.5rem;
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 16px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-family: inherit;
  transition: all 0.35s ease;
}
.section-box:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 40px rgba(37, 99, 235, 0.18);
  border-color: rgba(37, 99, 235, 0.25);
  background: rgba(255, 255, 255, 0.85);
}
.section-box-name {
  font-size: 1.15rem; font-weight: 500;
  letter-spacing: 0.04em; margin-bottom: 0.4rem;
}
.section-box-desc {
  font-size: 0.85rem; color: var(--text-secondary);
  line-height: 1.6;
}

/* ===== 第二级：图片网格 ===== */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}
.photo-card {
  display: flex; flex-direction: column;
  border: none; border-radius: 8px;
  cursor: pointer;
  padding: 0;
  background: none;
  font-family: inherit;
}
.photo-thumb {
  aspect-ratio: 1 / 1;
  width: 100%;
  background: var(--line-light);
  border-radius: 8px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  letter-spacing: 0.03em;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.photo-card:hover .photo-thumb { transform: scale(1.03); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-caption {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  color: #000;
  letter-spacing: 0.04em;
  text-align: center;
}

/* ===== 第三级：图文详情 ===== */
.event-detail { max-width: 760px; }
.event-image {
  width: 100%; aspect-ratio: 16 / 10;
  background: var(--line-light); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 0.85rem;
  margin-bottom: 1.5rem; overflow: hidden;
}
.event-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.event-images {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.event-images .event-image {
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  margin-bottom: 0;
}
.event-title {
  font-size: 1.4rem; font-weight: 500;
  letter-spacing: 0.03em; margin-bottom: 0.75rem;
}
.event-desc {
  font-size: 0.95rem; color: var(--text-secondary);
  line-height: 1.9;
}

/* 左图右文排版：仅对 layout: 'split' 的事件生效 */
.event-detail-split {
  max-width: 1040px;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 2.5rem;
  align-items: start;
}
.event-detail-split .event-image { aspect-ratio: 4 / 3; margin-bottom: 0; }
.event-detail-split .event-images {
  grid-template-columns: 1fr;
  margin-bottom: 0;
}
.event-detail-split .event-images .event-image { aspect-ratio: 4 / 3; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .cover-title { font-size: 1.8rem; }
  .home-name { font-size: 2rem; }
  .home-cards { flex-direction: column; align-items: center; }
  .content-page { padding: 2rem 1rem 3rem; }
  .section-grid { grid-template-columns: repeat(2, 1fr); }
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
  .nav { padding: 0 1rem; }
  .event-detail-split { grid-template-columns: 1fr; gap: 1.5rem; }
}
</style>
</head>
<body>

<!-- ========== Cover Page ========== -->
<div class="cover" id="cover">
  <h1 class="cover-title">Y.X.X</h1>
  <p class="cover-subtitle" style="margin-bottom: 0.5rem;">Kvaratz.77</p>
  <div class="cover-scroll-hint">
    <span>向下滚动</span>
    <div class="cover-arrow"></div>
  </div>
</div>

<!-- ========== Background Decorative Lines ========== -->
<div class="bg-lines">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="none">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#2563eb" stroke-width="1" />
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#2563eb" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="800" stroke="#2563eb" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="800" stroke="#2563eb" stroke-width="1" />
    <circle cx="300" cy="200" r="3" fill="#2563eb" />
    <circle cx="900" cy="600" r="3" fill="#2563eb" />
    <circle cx="600" cy="400" r="2" fill="#c9a84c" />
  </svg>
</div>

<!-- ========== Navigation ========== -->
<nav class="nav" id="nav">
  <a class="nav-brand" data-page="home">杨许煊</a>
</nav>

<!-- ========== Main Content ========== -->
<div class="main-wrapper" id="mainWrapper">

  <!-- ===== Home Page ===== -->
  <div class="page home active" id="page-home">
    <div class="home-intro">
      <h1 class="home-name">杨许煊</h1>
      <p class="home-desc">无边落木萧萧下 克瓦拉茨赫利亚</p>
    </div>
    <div class="home-cards">
      <div class="home-card" data-page="highschool">
        <div class="home-card-icon">HS</div>
        <div class="home-card-title">高中</div>
        <div class="home-card-desc">高考学习 · 学科竞赛<br>足球 · 校园生活</div>
      </div>
      <div class="home-card" data-page="university">
        <div class="home-card-icon">UNI</div>
        <div class="home-card-title">大学</div>
        <div class="home-card-desc">实习 · 科研 · 竞赛 · 足球<br>志愿者 · 英语 · 更多</div>
      </div>
    </div>
  </div>

  <!-- ===== High School Page ===== -->
  <div class="page" id="page-highschool"></div>

  <!-- ===== University Page ===== -->
  <div class="page" id="page-university"></div>

</div>

<script src="js/fallback-data.js"></script>
<script src="js/content.js"></script>
<script src="js/storage.js"></script>
<script>
// ========== State ==========
const state = {
  currentPage: 'home',
  coverRevealed: false,
};

// ========== Data ==========
// 内容源：优先 data.json，其次 FALLBACK_DATA（js/fallback-data.js）。
// 由 js/content.js 的 ensureEventIds 补全事件 id。
let contentData = ensureEventIds(FALLBACK_DATA);

// ========== View state ==========
const viewState = {
  highschool: { level: 'sections', sectionId: null, eventIndex: null },
  university: { level: 'sections', sectionId: null, eventIndex: null },
};

// ========== DOM refs ==========
const cover = document.getElementById('cover');
const nav = document.getElementById('nav');
const mainWrapper = document.getElementById('mainWrapper');

// ========== Cover: bidirectional scroll ==========
let coverScrollLock = false;

function handleCoverScroll(e) {
  if (coverScrollLock) return;

  // Cover visible + scroll down → reveal
  if (!state.coverRevealed && e.deltaY > 0) {
    coverScrollLock = true;
    hideCover();
    setTimeout(() => { coverScrollLock = false; }, 800);
    return;
  }

  // Cover hidden + at page top + on home page + scroll up → show cover
  if (state.coverRevealed && e.deltaY < 0 && window.scrollY === 0 && state.currentPage === 'home') {
    coverScrollLock = true;
    showCover();
    setTimeout(() => { coverScrollLock = false; }, 800);
    return;
  }
}

function hideCover() {
  state.coverRevealed = true;
  cover.classList.add('hidden');
  nav.classList.add('visible');
  document.body.style.overflow = '';
  navigateTo('home');
}

function showCover() {
  state.coverRevealed = false;
  cover.classList.remove('hidden');
  nav.classList.remove('visible');
  document.body.style.overflow = 'hidden';
  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  window.scrollTo({ top: 0 });
}

// Touch support for cover
let touchStartY = 0;
cover.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });
cover.addEventListener('touchmove', (e) => {
  if (state.coverRevealed) return;
  const delta = touchStartY - e.touches[0].clientY;
  if (delta > 30) hideCover();
}, { passive: true });

window.addEventListener('wheel', handleCoverScroll, { passive: true });

// ========== Navigation ==========
function navigateTo(page) {
  state.currentPage = page;

  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  // Show target page
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');

  // Replay home reveal animation
  if (page === 'home') {
    const home = document.getElementById('page-home');
    home.classList.remove('revealing');
    void home.offsetWidth; // 强制重排，让动画能重新触发
    home.classList.add('revealing');
  } else if (page === 'highschool' || page === 'university') {
    // 每次从首页进入内容页，都从第一级「板块方框」开始
    viewState[page] = { level: 'sections', sectionId: null, eventIndex: null };
    renderContentPage(page);
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Nav brand click
document.querySelector('.nav-brand').addEventListener('click', () => navigateTo('home'));

// Home card clicks
document.querySelectorAll('.home-card[data-page]').forEach(card => {
  card.addEventListener('click', () => navigateTo(card.dataset.page));
});

// ========== Content Page Rendering ==========
function renderContentPage(pageKey) {
  const pageEl = document.getElementById('page-' + pageKey);
  const data = contentData[pageKey];
  const vs = viewState[pageKey];
  let html = '';

  if (vs.level === 'sections') {
    // 第一级：板块方框
    html = `
      <div class="content-page">
        <div class="view-header">
          <button class="view-back" data-back><span class="back-arrow"></span>返回</button>
          <span class="view-title">${data.name}</span>
        </div>
        <div class="section-grid ${data.grid || ''}">
          ${data.sections.map(s => `
            <button class="section-box" data-section="${s.id}">
              <div class="section-box-name">${s.name}</div>
              <div class="section-box-desc">${s.desc}</div>
            </button>`).join('')}
        </div>
      </div>`;
  } else if (vs.level === 'grid') {
    // 第二级：图片网格
    const section = data.sections.find(s => s.id === vs.sectionId);
    html = `
      <div class="content-page">
        <div class="view-header">
          <button class="view-back" data-back><span class="back-arrow"></span>返回</button>
          <span class="view-title">${section.name}</span>
        </div>
        <div class="photo-grid">
          ${section.events.map((e, i) => {
            const thumb = e.cover || e.imgs[0];
            return `
            <button class="photo-card" data-event="${i}">
              <span class="photo-thumb">${thumb ? `<img src="${thumb}" alt="${e.title}">` : '待补充图片'}</span>
              ${e.caption ? `<span class="photo-caption">${e.caption}</span>` : ''}
            </button>`;
          }).join('')}
        </div>
      </div>`;
  } else if (vs.level === 'detail') {
    // 第三级：图文详情
    const section = data.sections.find(s => s.id === vs.sectionId);
    const event = section.events[vs.eventIndex];

    let imagesHtml = '';
    if (event.imgs.length === 1) {
      imagesHtml = `<div class="event-image"><img src="${event.imgs[0]}" alt="${event.title}"></div>`;
    } else if (event.imgs.length > 1) {
      imagesHtml = `<div class="event-images">${event.imgs.map(img => `<div class="event-image"><img src="${img}" alt="${event.title}"></div>`).join('')}</div>`;
    } else {
      imagesHtml = `<div class="event-image">待补充图片</div>`;
    }

    const bodyHtml = `
          <h2 class="event-title">${event.title}</h2>
          <p class="event-desc">${event.desc}</p>`;

    // layout: 'split' → 左图右文；其余沿用默认的上图下文
    const detailHtml = event.layout === 'split'
      ? `<div class="event-detail event-detail-split">
          <div class="event-split-media">${imagesHtml}</div>
          <div class="event-split-body">${bodyHtml}</div>
        </div>`
      : `<div class="event-detail">
          ${imagesHtml}${bodyHtml}
        </div>`;

    html = `
      <div class="content-page">
        <div class="view-header">
          <button class="view-back" data-back><span class="back-arrow"></span>返回</button>
          <span class="view-title">${event.caption || section.name}</span>
        </div>
        ${detailHtml}
      </div>`;
  }

  pageEl.innerHTML = html;
  bindContentPage(pageKey);
}

function bindContentPage(pageKey) {
  const pageEl = document.getElementById('page-' + pageKey);
  const vs = viewState[pageKey];

  // 板块方框 → 图片网格
  pageEl.querySelectorAll('.section-box').forEach(box => {
    box.addEventListener('click', () => {
      vs.level = 'grid';
      vs.sectionId = box.dataset.section;
      vs.eventIndex = null;
      renderContentPage(pageKey);
      window.scrollTo({ top: 0 });
    });
  });

  // 图片 → 图文详情
  pageEl.querySelectorAll('.photo-card').forEach(card => {
    card.addEventListener('click', () => {
      vs.level = 'detail';
      vs.eventIndex = parseInt(card.dataset.event, 10);
      renderContentPage(pageKey);
      window.scrollTo({ top: 0 });
    });
  });

  // 返回上一级
  pageEl.querySelectorAll('.view-back').forEach(btn => {
    btn.addEventListener('click', () => {
      if (vs.level === 'detail') { vs.level = 'grid'; }
      else if (vs.level === 'grid') { vs.level = 'sections'; vs.sectionId = null; }
      else { navigateTo('home'); return; }  // 第一级：返回首页
      renderContentPage(pageKey);
      window.scrollTo({ top: 0 });
    });
  });
}

// ========== Initial state ==========
document.body.style.overflow = 'hidden';

// If user navigates directly without cover (e.g. page refresh scrolled down), show content
if (window.scrollY > 100) {
  hideCover();
}

// ========== Init: load content ==========
(async function init() {
  const loaded = await loadData();
  contentData = loaded ? ensureEventIds(loaded) : ensureEventIds(FALLBACK_DATA);
  const draft = getDraft();
  if (draft) contentData = draft;
  if (state.currentPage === 'highschool' || state.currentPage === 'university') {
    renderContentPage(state.currentPage);
  }
})();
</script>
